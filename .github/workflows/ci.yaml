name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-colcon-common-extensions ros-humble-xacro
          rosdep update --rosdistro=humble
          rosdep install --from-paths src --ignore-src -r -y || true

      - name: Build all packages
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"

      - name: Validate xacro processing
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro src/agv_sim_description/urdf/agv_sim.urdf.xacro > /dev/null

      - name: Run URDF tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd src/agv_sim_description
          python3 -m pytest test/test_urdf.py -v --tb=short
