# ODrive-realistic wheel shaping parameters.
#
# Values MUST match the real agv_odrive/config/odrive_params.yaml
# (calibrated 2026-04-08). When the brain's odrive_params.yaml changes,
# update this file in lock-step.
/**/sim_drive_shaping_node:
  ros__parameters:
    wheel_radius: 0.0781         # meters (diameter 156.2mm)
    track_width: 0.960           # meters (effective, calibrated)
    gear_ratio: 10.0             # 10:1 planetary
    publish_rate_hz: 50
    cmd_vel_timeout_ms: 200      # stop if no cmd_vel for this long (brain value)
    invert_left: true            # CAN 0 direction (matches real robot)
    invert_right: false          # CAN 1
    left_scale: 1.0
    right_scale: 1.0
    zero_vel_epsilon: 0.03       # turns/s — below this, send exact zero
    min_effective_vel: 0.0       # turns/s — disabled (no stiction compensation)
    max_wheel_accel: 5.0         # motor turns/s² (~0.5 m/s² chassis) — robot reaches 0.5 m/s in ~1 s. Lowering this to 1.5 was tested and HURT efficiency: the wheels never reach target speed within a Nav2 short-waypoint window, so they propel the chassis less. The 94% slip at 5.0 turns out to be the LESS bad option.
    max_wheel_decel: 1.5         # turns/s² — currently unused by C++ node; kept for parity with brain config
