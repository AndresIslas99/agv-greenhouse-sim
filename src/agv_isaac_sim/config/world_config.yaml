# Greenhouse world geometry configuration for Isaac Sim USD builder.
# All positions in meters, angles in degrees.
#
# This file is the single source of truth for the greenhouse layout.
# Modify here to change dimensions, add tags, move obstacles, etc.

textures:
  base_dir: "agv_isaac_sim/assets/greenhouse_textures"
  tag_dir: "agv_isaac_sim/assets/tag_textures"

physics:
  timestep_hz: 200              # 5 ms — matches real BMI088 IMU rate, baked into PhysX scene
  solver_iterations: 16        # 12 was OK for clutter; bumped to 16 to absorb the high mass-ratio caster contact (chassis 30 kg / caster 1 kg = 30:1, near PhysX safe limit). More iters = better convergence on the front-caster contact under chassis CoM offset.
  gpu_broadphase: true
  gpu_dynamics: true
  gpu_max_contacts: 524288
  gravity: [0.0, 0.0, -9.81]

ground:
  size: [49.0, 19.0, 0.1]
  position: [5.5, 0.0, -0.05]
  slope_percent: 0.5             # 0.5% longitudinal drainage slope (real greenhouse)
  material: {texture: "ground_soil.png", roughness: 0.95, metallic: 0.0}

walls:
  height: 3.0
  thickness: 0.2
  enable_glass: true              # true = OmniGlass (realistic polycarbonate), false = opaque OmniPBR
  glass:                          # OmniGlass material params (when enable_glass: true)
    ior: 1.59                     # polycarbonate refractive index
    color: [0.92, 0.95, 0.90]    # slight green tint from greenhouse glass
    frosting_roughness: 0.35      # frosted finish (diffuses transmitted light)
    thin_walled: true
  material: {texture: "wall_polycarbonate.png", roughness: 0.85, metallic: 0.0}
  specs:
    - {name: North, position: [5.5, 7.5, 1.5],   size: [45.0, 0.2, 3.0]}
    - {name: South, position: [5.5, -7.5, 1.5],  size: [45.0, 0.2, 3.0]}
    - {name: West,  position: [-17.0, 0.0, 1.5],  size: [0.2, 15.0, 3.0]}
    - {name: East,  position: [28.0, 0.0, 1.5],   size: [0.2, 15.0, 3.0]}

crop_rows:
  length: 20.0
  # 0.5 m matches real-world greenhouse row width (lettuce/tomato/cucumber:
  # 0.3-0.6 m typical). 1.0 m left only 0.10 m of clearance per side for
  # the 1.01 m wide robot, so any lateral oscillation would clip the row
  # foliage and trigger an IMU spike → EKF divergence. With width 0.5 the
  # gap between adjacent rows (centers 2.2 m apart) opens to 1.7 m,
  # giving the robot 0.35 m clearance per side.
  width: 0.5
  height: 1.5
  center_x: 16.0
  y_positions: [-5.5, -3.3, -1.1, 1.1, 3.3, 5.5]
  # Foliage simulation: rows are built from segments with gaps to simulate
  # porous leaf canopy. This gives realistic depth camera returns (not flat walls).
  foliage:
    segment_length: 0.8         # each plant segment along X
    gap_length: 0.15            # gap between plants (air, visible to depth camera)
    height_variation: 0.15      # ±random height variation per segment
    width_variation: 0.05       # ±random width variation per segment
  materials:
    - {texture: "crop_leaves.png", roughness: 0.9, metallic: 0.0}
    - {texture: "crop_leaves_alt.png", roughness: 0.9, metallic: 0.0}

rails:
  radius: 0.0255          # 51mm diameter / 2
  length: 20.0
  center_x: 16.0
  pair_spacing: 0.45       # center-to-center within aisle
  aisle_centers_y: [-4.4, -2.2, 0.0, 2.2, 4.4]
  material: {texture: "rail_steel.png", roughness: 0.6, metallic: 0.3}

roof_beams:
  beam_size: 0.08
  height: 3.0
  transverse_x: [5.0, 10.0, 15.0, 20.0, 25.0]
  transverse_span: 15.0
  longitudinal_y: [-3.5, 3.5]
  longitudinal_span: 30.0
  longitudinal_center_x: 15.0
  material: {texture: "", roughness: 0.4, metallic: 0.5}

apriltags:
  tag_size: 0.2            # face dimensions
  border_size: 0.25        # backing plate dimensions
  tag_thickness: 0.001
  border_thickness: 0.005
  family: "tag36h11"
  total_count: 36          # IDs 0-37, placed by build_greenhouse_usd.py
  # OmniPBR material params for RTX detection optimization
  material:
    roughness: 1.0          # perfectly matte (no specular glare)
    metallic: 0.0
    specular: 0.0           # zero specular for consistent camera detection
    emissive: 0.0           # set to 0.05 for subtle self-illumination in dark scenes
    color_space: "raw"      # prevent sRGB gamma curve on B/W tag data
  border_material:
    roughness: 1.0
    metallic: 0.0
    specular: 0.0
    diffuse_color: [0.95, 0.95, 0.95]
  # Note: Full 36-tag placement is hardcoded in build_greenhouse_usd.py
  # (expanded greenhouse with front + rear sections).
  # The entries below are the original 6 reference tags.
  tags:
    - id: 0
      description: "West wall, corridor center, facing +X"
      mount_type: wall_west
      position: [0.106, 0.0, 0.25]     # wall face + border_thickness + 1mm
      yaw: 90.0
    - id: 1
      description: "East wall, corridor center, facing -X"
      mount_type: wall_east
      position: [29.894, 0.0, 0.25]
      yaw: -90.0
    - id: 2
      description: "Aisle 1-2 west entrance, facing -X"
      mount_type: post
      position: [6.0, -4.4, 0.25]
      yaw: -90.0
    - id: 3
      description: "Aisle 3-4 west entrance, facing -X"
      mount_type: post
      position: [6.0, 0.0, 0.25]
      yaw: -90.0
    - id: 4
      description: "Aisle 5-6 west entrance, facing -X"
      mount_type: post
      position: [6.0, 4.4, 0.25]
      yaw: -90.0
    - id: 5
      description: "Starting area, facing +X"
      mount_type: post
      position: [2.5, -5.0, 0.25]
      yaw: 0.0

obstacles:
  material: {texture: "crate_wood.png", roughness: 0.85, metallic: 0.0}
  crates:
    - {name: Crate1, position: [3.5, -2.0, 0.15], size: [0.5, 0.4, 0.3], yaw: 17.2}
    - {name: Crate2, position: [4.0, 3.5, 0.15], size: [0.5, 0.4, 0.3], yaw: -11.5}
    - {name: Crate3, position: [25.0, 0.0, 0.15], size: [0.5, 0.4, 0.3], yaw: 28.6}

# NVIDIA asset-based props (loaded as USD references from Isaac Sim asset library)
props:
  enabled: true
  items:
    - {asset: "pallet", position: [1.5, -6.0, 0.0], yaw: 10.0, scale: 1.0}
    - {asset: "small_klt", position: [2.0, -5.8, 0.15], yaw: -5.0, scale: 1.0}
    - {asset: "small_klt", position: [2.3, -5.5, 0.15], yaw: 22.0, scale: 1.0}
    - {asset: "pallet", position: [26.0, 5.0, 0.0], yaw: -8.0, scale: 1.0}

lighting:
  # Greenhouse lighting: diffuse through translucent polycarbonate roof.
  # Real greenhouses have almost no hard shadows — light is scattered by
  # ribbed polycarbonate panels. Sun reduced, dome increased to simulate.
  sun:
    intensity: 1200.0            # was 3000 — too directional for greenhouse
    color: [1.0, 0.98, 0.92]    # warm daylight (5500K approximate)
    angle: 1.0                   # wider sun disk = softer shadows
    rotation: [-64.0, -27.0, 0.0]
  fill:
    intensity: 600.0
    color: [0.45, 0.45, 0.48]   # cool fill for contrast
    rotation: [-45.0, 30.0, 0.0]
  ambient_dome:
    intensity: 500.0             # was 200 — primary light source in greenhouse
    color: [0.3, 0.3, 0.28]     # warm ambient from soil/leaf reflection (fallback when no HDRI)
    hdri: "greenhouse_sky.hdr"   # relative to textures/ dir; empty = solid color
                                 # generate with: python3 scripts/generate_hdri.py
    hdri_rotation: 0.0           # degrees — rotate HDRI for time-of-day variation

  # Supplemental interior lights (simulate overhead grow lights / HPS lamps)
  supplemental_lights:
    enabled: true
    positions_x: [5.0, 15.0, 25.0]   # X positions along greenhouse length
    intensity: 200.0                   # moderate fill to reduce shadow zones
    color: [0.95, 0.97, 0.90]        # warm daylight through polycarbonate
    width: 4.0                         # rect light width (m)
    height: 2.0                        # rect light height (m)
    mount_z: 2.85                      # mounting height (just below roof beams at 3m)

  # Tier 2: Volumetric fog for humidity simulation
  # Isaac Sim RTX supports volumetric particles. Enable when needed.
  fog:
    enabled: false               # set true to enable humidity fog
    density: 0.02                # particles/m³ (light haze = 0.01, misting = 0.1)
    color: [0.95, 0.95, 1.0]    # slightly blue-white water vapor
    height_max: 2.0              # fog below 2m (where misting occurs)
