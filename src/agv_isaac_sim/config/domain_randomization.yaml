# Domain randomization configuration for sim-to-real transfer.
#
# Each parameter has a {min, max} range. The randomizer samples
# uniformly within these ranges per episode.
#
# Run: isaacsim --exec sim_domain_randomizer.py
# Or:  ros2 service call /randomize_episode std_srvs/srv/Trigger

lighting:
  sun_intensity: {min: 800, max: 1600}       # nominal 1200 ±33%
  dome_intensity: {min: 350, max: 650}        # nominal 500 ±30%
  fill_intensity: {min: 400, max: 800}        # nominal 600 ±33%
  sun_rotation_offset: {min: -15, max: 15}    # degrees azimuth jitter
  color_temp_offset: {min: -0.03, max: 0.03}  # RGB shift for color temp

crop_rows:
  height_scale: {min: 0.8, max: 1.2}          # ±20% plant height
  width_scale: {min: 0.9, max: 1.1}           # ±10% plant width
  gap_scale: {min: 0.5, max: 2.0}             # ±variable gaps (some tight, some wide)
  missing_plant_rate: 0.05                      # 5% chance each plant slot is empty

physics:
  wheel_friction_scale: {min: 0.85, max: 1.15}   # ±15% of calibrated 0.7/0.6
  caster_friction_scale: {min: 0.7, max: 1.3}    # ±30% of calibrated 0.03/0.025
  ground_friction_scale: {min: 0.9, max: 1.1}    # ±10% of calibrated 0.8/0.6

materials:
  roughness_offset: {min: -0.05, max: 0.05}    # slight surface finish variation
  brightness_offset: {min: -0.03, max: 0.03}   # simulate lighting/dirt variation

obstacles:
  extra_crates: {min: 0, max: 3}               # 0-3 additional random crates
  crate_position_jitter: {min: -0.5, max: 0.5} # meters, per axis

fog:
  fog_factor: {min: 0.0, max: 1.5}             # 0=clear, 1.5=heavy mist
