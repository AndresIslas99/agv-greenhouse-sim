# Isaac Sim ROS 2 topic mapping reference
#
# Isaac Sim 4.x publishes ROS 2 topics natively via OmniGraph.
# This file documents the topic contract (same as gz_bridge.yaml).
# No external bridge process needed — topics are configured in
# import_robot_usd.py when setting up sensors and actuators.

# --- Sim → ROS (sensor data) ---
clock:
  topic: /clock
  type: rosgraph_msgs/msg/Clock
  source: isaac_sim_internal

wheel_odom:
  topic: /agv/wheel_odom
  type: nav_msgs/msg/Odometry
  rate: 50
  note: "Wheel friction calibrated: μs=0.7/μd=0.6 (rubber on soil)"
  frame_id: odom
  child_frame_id: base_link
  source: DifferentialController

joint_states:
  topic: /agv/joint_states
  type: sensor_msgs/msg/JointState
  rate: 50
  source: JointStatePublisher

imu:
  topic: /zed/zed_node/imu/data
  type: sensor_msgs/msg/Imu
  rate: 100
  frame_id: imu_link
  source: IsaacIMU
  # Also published as /agv/imu/data

left_rgb:
  topic: /zed/zed_node/left/image_rect_color
  type: sensor_msgs/msg/Image
  rate: 15
  frame_id: zed_left_camera_frame_optical
  source: IsaacCamera (left)

left_depth:
  topic: /zed/zed_node/depth/depth_registered
  type: sensor_msgs/msg/Image
  rate: 15
  frame_id: zed_left_camera_frame_optical
  source: IsaacCamera (left, depth output)

left_camera_info:
  topic: /zed/zed_node/left/camera_info
  type: sensor_msgs/msg/CameraInfo
  rate: 15
  source: IsaacCamera (left)

right_rgb:
  topic: /zed/zed_node/right/image_rect_color
  type: sensor_msgs/msg/Image
  rate: 15
  frame_id: zed_right_camera_frame_optical
  source: IsaacCamera (right)

right_camera_info:
  topic: /zed/zed_node/right/camera_info
  type: sensor_msgs/msg/CameraInfo
  rate: 15
  source: IsaacCamera (right)

point_cloud:
  topic: /zed/zed_node/point_cloud/cloud_registered
  type: sensor_msgs/msg/PointCloud2
  rate: 15
  frame_id: zed_left_camera_frame_optical
  source: IsaacCamera (left, point cloud output)

# --- ROS → Sim (commands) ---
cmd_vel:
  topic: /agv/shaped_cmd_vel
  type: geometry_msgs/msg/Twist
  direction: subscribe
  source: DifferentialController
